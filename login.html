<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sistema de Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a26;
      --border: #2a2a3d;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --accent3: #43e97b;
      --text: #e8e8f0;
      --muted: #6b6b8a;
      --admin-color: #ff6584;
      --worker-color: #6c63ff;
      --public-color: #43e97b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }

    /* Glowing orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }
    .orb1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; animation-delay: 0s; }
    .orb2 { width: 300px; height: 300px; background: var(--accent2); bottom: -80px; right: -80px; animation-delay: 3s; }
    .orb3 { width: 200px; height: 200px; background: var(--accent3); bottom: 20%; left: 10%; animation-delay: 6s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }

    /* Main container */
    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      position: relative;
      overflow: hidden;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 16px;
      margin-bottom: 16px;
      font-size: 24px;
    }

    .header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .header p {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--surface2);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 7px;
      transition: all 0.2s;
      letter-spacing: 0.05em;
    }

    .tab.active {
      background: var(--accent);
      color: #fff;
    }

    /* Forms */
    .form-panel { display: none; }
    .form-panel.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.12);
    }

    input::placeholder { color: var(--muted); }

    /* Password wrapper */
    .pw-wrap {
      position: relative;
    }
    .pw-wrap input { padding-right: 44px; }
    .pw-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 0;
    }

    /* Hash preview */
    .hash-preview {
      background: var(--surface2);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 0.65rem;
      color: var(--muted);
      word-break: break-all;
      transition: all 0.3s;
    }
    .hash-preview.has-value { color: var(--accent3); border-color: rgba(67,233,123,0.3); }
    .hash-label { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }

    /* Button */
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
      margin-top: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(108,99,255,0.35); }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 8px;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* Alert */
    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.78rem;
      margin-bottom: 16px;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .alert.show { display: flex; align-items: center; gap: 8px; }
    .alert-error { background: rgba(255,101,132,0.1); border: 1px solid rgba(255,101,132,0.3); color: var(--accent2); }
    .alert-success { background: rgba(67,233,123,0.1); border: 1px solid rgba(67,233,123,0.3); color: var(--accent3); }
    .alert-info { background: rgba(108,99,255,0.1); border: 1px solid rgba(108,99,255,0.3); color: var(--accent); }

    /* Dashboard */
    .dashboard {
      display: none;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dashboard.active { display: block; }

    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .dash-title { font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800; }

    .role-badge {
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .badge-admin { background: rgba(255,101,132,0.15); color: var(--admin-color); border: 1px solid rgba(255,101,132,0.3); }
    .badge-trabajador { background: rgba(108,99,255,0.15); color: var(--worker-color); border: 1px solid rgba(108,99,255,0.3); }
    .badge-publico { background: rgba(67,233,123,0.15); color: var(--public-color); border: 1px solid rgba(67,233,123,0.3); }

    .user-info {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row span:first-child { color: var(--muted); }
    .info-row span:last-child { color: var(--text); }

    .perms-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .perm-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .perm-card.granted { border-color: rgba(67,233,123,0.3); }
    .perm-card.denied { opacity: 0.4; }
    .perm-icon { font-size: 16px; }

    /* Users list (admin only) */
    .users-list { margin-top: 20px; }
    .users-list h3 { font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; margin-bottom: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

    .user-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 0.78rem;
    }
    .user-item-left { display: flex; align-items: center; gap: 10px; }
    .user-avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
    }
    .av-admin { background: rgba(255,101,132,0.2); color: var(--admin-color); }
    .av-trabajador { background: rgba(108,99,255,0.2); color: var(--worker-color); }
    .av-publico { background: rgba(67,233,123,0.2); color: var(--public-color); }

    .user-meta { display: flex; flex-direction: column; gap: 2px; }
    .user-meta strong { color: var(--text); }
    .user-meta small { color: var(--muted); font-size: 0.68rem; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="wrapper">
    <!-- LOGIN CARD -->
    <div class="card" id="loginCard">
      <div class="header">
        <div class="logo">🔐</div>
        <h1>Sistema de Acceso</h1>
        <p>Autenticación SHA-256 · Multirol</p>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Iniciar Sesión</button>
        <button class="tab" onclick="switchTab('register')">Registrarse</button>
      </div>

      <!-- LOGIN FORM -->
      <div class="form-panel active" id="loginPanel">
        <div id="loginAlert" class="alert"></div>

        <div class="field">
          <label>Usuario</label>
          <input type="text" id="loginUser" placeholder="nombre_usuario" autocomplete="off"/>
        </div>

        <div class="field">
          <label>Contraseña</label>
          <div class="pw-wrap">
            <input type="password" id="loginPass" placeholder="••••••••" />
            <button class="pw-toggle" onclick="togglePw('loginPass')">👁</button>
          </div>
          <!-- <div class="hash-label" style="margin-top:6px;">Hash SHA-256:</div> -->
          <!-- <div class="hash-preview" id="loginHashPreview">—</div> -->
        </div>

        <button class="btn btn-primary" onclick="doLogin()">Ingresar →</button>
      </div>

      <!-- REGISTER FORM -->
      <div class="form-panel" id="registerPanel">
        <div id="registerAlert" class="alert"></div>

        <div class="field">
          <label>Nombre completo</label>
          <input type="text" id="regName" placeholder="Ej. Ana López"/>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="correo@dominio.com"/>
        </div>
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="regUser" placeholder="nombre_usuario"/>
        </div>
        <div class="field">
          <label>Contraseña</label>
          <div class="pw-wrap">
            <input type="password" id="regPass" placeholder="Mínimo 6 caracteres"/>
            <button class="pw-toggle" onclick="togglePw('regPass')">👁</button>
          </div>
          <!-- <div class="hash-label" style="margin-top:6px;">Hash SHA-256:</div> -->
          <!-- <div class="hash-preview" id="regHashPreview">—</div> -->
        </div>
        <p style="font-size:0.7rem;color:var(--muted);margin-bottom:12px;">
          ℹ️ Las cuentas nuevas se crean con rol <strong style="color:var(--public-color)">Público</strong> por defecto.
        </p>
        <button class="btn btn-primary" onclick="doRegister()">Crear Cuenta →</button>
      </div>
    </div>

    <!-- DASHBOARD CARD -->
    <div class="card dashboard" id="dashCard">
      <div class="dash-header">
        <div class="dash-title" id="dashTitle">Panel</div>
        <span class="role-badge" id="dashBadge"></span>
      </div>

      <div id="dashAlert" class="alert"></div>

      <div class="user-info">
        <div class="info-row"><span>Nombre</span><span id="dName">—</span></div>
        <div class="info-row"><span>Usuario</span><span id="dUser">—</span></div>
        <div class="info-row"><span>Email</span><span id="dEmail">—</span></div>
        <div class="info-row"><span>Rol</span><span id="dRole">—</span></div>
        <div class="info-row"><span>Sesión</span><span id="dTime">—</span></div>
      </div>

      <div class="perms-grid" id="permsGrid"></div>

      <div class="users-list" id="adminPanel" style="display:none">
        <h3>👥 Usuarios Registrados</h3>
        <div id="usersList"></div>
      </div>

      <button class="btn btn-secondary" onclick="doLogout()">← Cerrar Sesión</button>
    </div>
  </div>

  <script>
    // ── DATABASE (cargada desde JSON embebido) ──────────────────────────
    // Esto simula la lectura/escritura del users.json en memoria del browser.
    // En un entorno Node.js/servidor se usaría fs.readFileSync / fs.writeFileSync.
    let DB = {
      "users": [
        {
          "id": 1,
          "username": "admin",
          "password": "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918",
          "role": "admin",
          "name": "Administrador",
          "email": "admin@sistema.com",
          "createdAt": "2026-01-01T00:00:00Z"
        },
        {
          "id": 2,
          "username": "trabajador1",
          "password": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08",
          "role": "trabajador",
          "name": "Juan Pérez",
          "email": "juan@empresa.com",
          "createdAt": "2026-01-15T00:00:00Z"
        },
        {
          "id": 3,
          "username": "usuario1",
          "password": "0a041b9462caa4a31bac3567e0b6e6fd9100787db2ab433d96f6d178cabfce90",
          "role": "publico",
          "name": "María García",
          "email": "maria@correo.com",
          "createdAt": "2026-02-10T00:00:00Z"
        }
      ]
    };
    // Credenciales de prueba:
    // admin / admin       → rol: admin
    // trabajador1 / test  → rol: trabajador
    // usuario1 / password → rol: publico

    // ── SHA-256 ────────────────────────────────────────────────────────
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ── LIVE HASH PREVIEW ─────────────────────────────────────────────
    document.getElementById('loginPass').addEventListener('input', async e => {
      const el = document.getElementById('loginHashPreview');
      if (!e.target.value) { el.textContent = '—'; el.className = 'hash-preview'; return; }
      const h = await sha256(e.target.value);
      el.textContent = h;
      el.className = 'hash-preview has-value';
    });

    document.getElementById('regPass').addEventListener('input', async e => {
      const el = document.getElementById('regHashPreview');
      if (!e.target.value) { el.textContent = '—'; el.className = 'hash-preview'; return; }
      const h = await sha256(e.target.value);
      el.textContent = h;
      el.className = 'hash-preview has-value';
    });

    // ── TABS ──────────────────────────────────────────────────────────
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0 && tab==='login') || (i===1 && tab==='register')));
      document.getElementById('loginPanel').classList.toggle('active', tab==='login');
      document.getElementById('registerPanel').classList.toggle('active', tab==='register');
      hideAlert('loginAlert'); hideAlert('registerAlert');
    }

    function togglePw(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    // ── ALERTS ────────────────────────────────────────────────────────
    function showAlert(id, msg, type) {
      const el = document.getElementById(id);
      el.className = `alert alert-${type} show`;
      el.innerHTML = (type==='error'?'✗':type==='success'?'✓':'ℹ') + ' ' + msg;
    }
    function hideAlert(id) {
      document.getElementById(id).className = 'alert';
    }

    // ── LOGIN ─────────────────────────────────────────────────────────
    async function doLogin() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;

      if (!username || !password) { showAlert('loginAlert','Completa todos los campos.','error'); return; }

      const hash = await sha256(password);
      const user = DB.users.find(u => u.username === username && u.password === hash);

      if (!user) { showAlert('loginAlert','Usuario o contraseña incorrectos.','error'); return; }

      renderDashboard(user);
    }

    // ── REGISTER (agrega usuario público por defecto) ─────────────────
    async function doRegister() {
      const name  = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value;

      if (!name || !email || !username || !password)
        { showAlert('registerAlert','Completa todos los campos.','error'); return; }
      if (password.length < 6)
        { showAlert('registerAlert','La contraseña debe tener al menos 6 caracteres.','error'); return; }
      if (DB.users.find(u => u.username === username))
        { showAlert('registerAlert','Ese nombre de usuario ya existe.','error'); return; }
      if (DB.users.find(u => u.email === email))
        { showAlert('registerAlert','Ese email ya está registrado.','error'); return; }

      const hash = await sha256(password);
      addUser({ name, email, username, password: hash });
      showAlert('registerAlert', `Cuenta creada exitosamente. Rol asignado: <strong>Público</strong>`, 'success');

      // Limpiar campos
      ['regName','regEmail','regUser','regPass'].forEach(id => document.getElementById(id).value='');
      document.getElementById('regHashPreview').textContent='—';
      document.getElementById('regHashPreview').className='hash-preview';

      setTimeout(() => switchTab('login'), 1800);
    }

    // ── AGREGAR USUARIO AL JSON (rol público por defecto) ─────────────
    function addUser({ name, email, username, password }) {
      const newUser = {
        id: DB.users.length + 1,
        username,
        password,           // SHA-256
        role: "publico",    // siempre público por defecto
        name,
        email,
        createdAt: new Date().toISOString()
      };
      DB.users.push(newUser);

      // Mostrar JSON actualizado en consola (simulando escritura al archivo)
      console.log("📁 users.json actualizado:");
      console.log(JSON.stringify(DB, null, 2));

      return newUser;
    }

    // ── DASHBOARD ─────────────────────────────────────────────────────
    const PERMS = {
      admin: [
        { icon:'👁', label:'Ver contenido', granted:true },
        { icon:'✏️', label:'Editar contenido', granted:true },
        { icon:'👥', label:'Gestionar usuarios', granted:true },
        { icon:'⚙️', label:'Configuración', granted:true },
      ],
      trabajador: [
        { icon:'👁', label:'Ver contenido', granted:true },
        { icon:'✏️', label:'Editar contenido', granted:true },
        { icon:'👥', label:'Gestionar usuarios', granted:false },
        { icon:'⚙️', label:'Configuración', granted:false },
      ],
      publico: [
        { icon:'👁', label:'Ver contenido', granted:true },
        { icon:'✏️', label:'Editar contenido', granted:false },
        { icon:'👥', label:'Gestionar usuarios', granted:false },
        { icon:'⚙️', label:'Configuración', granted:false },
      ]
    };

    function renderDashboard(user) {
      document.getElementById('loginCard').style.display='none';
      document.getElementById('dashCard').classList.add('active');

      const titles = { admin:'Panel Admin', trabajador:'Panel Trabajador', publico:'Panel Público' };
      document.getElementById('dashTitle').textContent = titles[user.role];

      const badge = document.getElementById('dashBadge');
      badge.textContent = user.role.toUpperCase();
      badge.className = `role-badge badge-${user.role}`;

      document.getElementById('dName').textContent = user.name;
      document.getElementById('dUser').textContent = '@' + user.username;
      document.getElementById('dEmail').textContent = user.email;
      document.getElementById('dRole').textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1);
      document.getElementById('dTime').textContent = new Date().toLocaleString('es-MX');

      // Permisos
      const grid = document.getElementById('permsGrid');
      grid.innerHTML = PERMS[user.role].map(p => `
        <div class="perm-card ${p.granted?'granted':'denied'}">
          <span class="perm-icon">${p.granted?p.icon:'🚫'}</span>
          <span>${p.label}</span>
        </div>
      `).join('');

      // Panel admin
      if (user.role === 'admin') {
        document.getElementById('adminPanel').style.display='block';
        const list = document.getElementById('usersList');
        list.innerHTML = DB.users.map(u => `
          <div class="user-item">
            <div class="user-item-left">
              <div class="user-avatar av-${u.role}">${u.name.charAt(0).toUpperCase()}</div>
              <div class="user-meta">
                <strong>${u.name}</strong>
                <small>@${u.username} · ${u.email}</small>
              </div>
            </div>
            <span class="role-badge badge-${u.role}">${u.role}</span>
          </div>
        `).join('');
      } else {
        document.getElementById('adminPanel').style.display='none';
      }
    }

    // ── LOGOUT ────────────────────────────────────────────────────────
    function doLogout() {
      document.getElementById('dashCard').classList.remove('active');
      document.getElementById('loginCard').style.display='block';
      document.getElementById('loginUser').value='';
      document.getElementById('loginPass').value='';
      document.getElementById('loginHashPreview').textContent='—';
      document.getElementById('loginHashPreview').className='hash-preview';
      hideAlert('loginAlert');
    }
  </script>
</body>
</html>
