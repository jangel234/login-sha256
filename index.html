<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sistema de Acceso | SHA-256 + Salt</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a26;
      --border: #2a2a3d;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --accent3: #43e97b;
      --text: #e8e8f0;
      --muted: #6b6b8a;
      --admin-color: #ff6584;
      --worker-color: #6c63ff;
      --public-color: #43e97b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* fondo animado */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }
    .orb1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; animation-delay: 0s; }
    .orb2 { width: 300px; height: 300px; background: var(--accent2); bottom: -80px; right: -80px; animation-delay: 3s; }
    .orb3 { width: 200px; height: 200px; background: var(--accent3); bottom: 20%; left: 10%; animation-delay: 6s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 32px;
      position: relative;
      overflow: hidden;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(2px);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 18px;
      margin-bottom: 18px;
      font-size: 26px;
      box-shadow: 0 8px 20px rgba(108,99,255,0.2);
    }

    .header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header p {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--surface2);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s;
      font-weight: 500;
    }

    .tab.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 2px 6px rgba(108,99,255,0.3);
    }

    .form-panel { display: none; }
    .form-panel.active { display: block; animation: fadeIn 0.25s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(6px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.2);
    }

    .pw-wrap {
      position: relative;
    }
    .pw-wrap input { padding-right: 44px; }
    .pw-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: white;
      box-shadow: 0 2px 8px rgba(108,99,255,0.3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(108,99,255,0.4); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    .alert {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.75rem;
      margin-bottom: 20px;
      display: none;
      gap: 8px;
      align-items: center;
    }
    .alert.show { display: flex; }
    .alert-error { background: rgba(255,101,132,0.12); border: 1px solid rgba(255,101,132,0.4); color: var(--accent2); }
    .alert-success { background: rgba(67,233,123,0.12); border: 1px solid rgba(67,233,123,0.4); color: var(--accent3); }
    .alert-info { background: rgba(108,99,255,0.12); border: 1px solid rgba(108,99,255,0.4); color: var(--accent); }

    .dashboard {
      display: none;
      animation: slideUp 0.5s ease;
    }
    .dashboard.active { display: block; }

    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .dash-title { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; }

    .role-badge {
      padding: 5px 14px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .badge-admin { background: rgba(255,101,132,0.18); color: var(--admin-color); border: 1px solid rgba(255,101,132,0.4); }
    .badge-trabajador { background: rgba(108,99,255,0.18); color: var(--worker-color); border: 1px solid rgba(108,99,255,0.4); }
    .badge-publico { background: rgba(67,233,123,0.18); color: var(--public-color); border: 1px solid rgba(67,233,123,0.4); }

    .user-info {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row span:first-child { color: var(--muted); font-weight: 400; }

    .perms-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .perm-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
    }
    .perm-card.granted { border-left: 3px solid var(--accent3); }
    .perm-card.denied { opacity: 0.5; }

    .users-list { margin-top: 20px; }
    .users-list h3 { font-size: 0.85rem; font-weight: 700; margin-bottom: 14px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }

    .user-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 8px;
    }
    .user-item-left { display: flex; align-items: center; gap: 12px; }
    .user-avatar {
      width: 36px; height: 36px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800;
      font-family: 'Syne', sans-serif;
    }
    .av-admin { background: rgba(255,101,132,0.2); color: var(--admin-color); }
    .av-trabajador { background: rgba(108,99,255,0.2); color: var(--worker-color); }
    .av-publico { background: rgba(67,233,123,0.2); color: var(--public-color); }

    .user-meta small { color: var(--muted); font-size: 0.65rem; }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="wrapper">
    <!-- LOGIN CARD -->
    <div class="card" id="loginCard">
      <div class="header">
        <div class="logo">⚡</div>
        <h1>Acceso Seguro</h1>
        <p>SHA-256 + SALT · Multirole</p>
      </div>

      <div class="tabs">
        <button class="tab active" id="tabLoginBtn" onclick="switchTab('login')">Iniciar Sesión</button>
        <button class="tab" id="tabRegBtn" onclick="switchTab('register')">Registrarse</button>
      </div>

      <!-- LOGIN FORM -->
      <div class="form-panel active" id="loginPanel">
        <div id="loginAlert" class="alert"></div>
        <div class="field">
          <label>👤 Usuario</label>
          <input type="text" id="loginUser" placeholder="admin / trabajador1 / usuario1" autocomplete="off"/>
        </div>
        <div class="field">
          <label>🔒 Contraseña</label>
          <div class="pw-wrap">
            <input type="password" id="loginPass" placeholder="••••••••" />
            <button class="pw-toggle" onclick="togglePw('loginPass')">👁️</button>
          </div>
        </div>
        <button class="btn btn-primary" onclick="doLogin()">Acceder →</button>
        <div style="margin-top: 16px; font-size:0.65rem; text-align:center; color:var(--muted);">
          📌 pruebas: admin / admin | trabajador1 / 1test | usuario1 / password
        </div>
      </div>

      <!-- REGISTER FORM -->
      <div class="form-panel" id="registerPanel">
        <div id="registerAlert" class="alert"></div>
        <div class="field">
          <label>Nombre completo</label>
          <input type="text" id="regName" placeholder="Ej. Ana López"/>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="correo@dominio.com"/>
        </div>
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="regUser" placeholder="nombre_usuario"/>
        </div>
        <div class="field">
          <label>Contraseña</label>
          <div class="pw-wrap">
            <input type="password" id="regPass" placeholder="Mínimo 6 caracteres"/>
            <button class="pw-toggle" onclick="togglePw('regPass')">👁️</button>
          </div>
        </div>
        <p style="font-size:0.7rem;color:var(--muted);margin-bottom:12px;">
          ℹ️ Nuevas cuentas → rol <strong style="color:var(--public-color)">Público</strong> (solo lectura)
        </p>
        <button class="btn btn-primary" onclick="doRegister()">Crear cuenta →</button>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div class="card dashboard" id="dashCard">
      <div class="dash-header">
        <div class="dash-title" id="dashTitle">Panel</div>
        <span class="role-badge" id="dashBadge"></span>
      </div>
      <div id="dashAlert" class="alert"></div>
      <div class="user-info">
        <div class="info-row"><span>Nombre</span><span id="dName">—</span></div>
        <div class="info-row"><span>Usuario</span><span id="dUser">—</span></div>
        <div class="info-row"><span>Email</span><span id="dEmail">—</span></div>
        <div class="info-row"><span>Rol</span><span id="dRole">—</span></div>
        <div class="info-row"><span>Sesión</span><span id="dTime">—</span></div>
      </div>

      <div class="perms-grid" id="permsGrid"></div>

      <div class="users-list" id="adminPanel" style="display:none">
        <h3>👥 Usuarios registrados</h3>
        <div id="usersList"></div>
      </div>

      <button class="btn btn-secondary" onclick="doLogout()">← Cerrar sesión</button>
    </div>
  </div>

  <script>
    // ---------- SHA-256 helper ----------
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function sha256WithSalt(password, salt) {
      return await sha256(password + salt);
    }

    function generateSalt() {
      const bytes = crypto.getRandomValues(new Uint8Array(8));
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ---------- BASE DE DATOS (se corregirán los hashes en init) ----------
    let DB = {
      users: [
        {
          id: 1,
          username: "admin",
          salt: "a7f3c2b8e9d4f1a6",
          password: "dummy",   // se recalculará
          role: "admin",
          name: "Administrador",
          email: "admin@sistema.com",
          createdAt: "2026-01-01T00:00:00Z"
        },
        {
          id: 2,
          username: "trabajador1",
          salt: "b5e1c3d2a7f8c9b1",
          password: "dummy",
          role: "trabajador",
          name: "Juan Pérez",
          email: "juan@empresa.com",
          createdAt: "2026-01-15T00:00:00Z"
        },
        {
          id: 3,
          username: "usuario1",
          salt: "f2a8b1c3d5e7f9a2",
          password: "dummy",
          role: "publico",
          name: "María García",
          email: "maria@correo.com",
          createdAt: "2026-02-10T00:00:00Z"
        }
      ]
    };

    // Credenciales reales de prueba (para corregir hashes)
    const DEMO_CREDENTIALS = {
      "admin": { plain: "admin", role: "admin" },
      "trabajador1": { plain: "1test", role: "trabajador" },
      "usuario1": { plain: "password", role: "publico" }
    };

    // ----- CORREGIR HASHES CON LOS SALT Y PASSWORDS REALES -----
    async function fixDemoPasswords() {
      for (let user of DB.users) {
        const demo = DEMO_CREDENTIALS[user.username];
        if (demo && demo.plain && user.salt) {
          const correctHash = await sha256WithSalt(demo.plain, user.salt);
          user.password = correctHash;
        }
      }
    }

    // ---- UTILS ----
    function showAlert(id, msg, type) {
      const el = document.getElementById(id);
      if (!el) return;
      el.className = `alert alert-${type} show`;
      el.innerHTML = (type==='error'?'✗ ':type==='success'?'✓ ': 'ℹ️ ') + msg;
    }
    function hideAlert(id) {
      const el = document.getElementById(id);
      if (el) el.className = 'alert';
    }

    function switchTab(tab) {
      const loginBtn = document.querySelectorAll('.tab')[0];
      const regBtn = document.querySelectorAll('.tab')[1];
      if (tab === 'login') {
        loginBtn.classList.add('active');
        regBtn.classList.remove('active');
        document.getElementById('loginPanel').classList.add('active');
        document.getElementById('registerPanel').classList.remove('active');
        hideAlert('loginAlert');
      } else {
        regBtn.classList.add('active');
        loginBtn.classList.remove('active');
        document.getElementById('registerPanel').classList.add('active');
        document.getElementById('loginPanel').classList.remove('active');
        hideAlert('registerAlert');
      }
    }

    function togglePw(id) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    // ----- LOGIN -----
    async function doLogin() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      if (!username || !password) {
        showAlert('loginAlert', 'Completa usuario y contraseña', 'error');
        return;
      }
      const user = DB.users.find(u => u.username === username);
      if (!user) {
        showAlert('loginAlert', 'Credenciales inválidas', 'error');
        return;
      }
      const computedHash = await sha256WithSalt(password, user.salt);
      if (computedHash !== user.password) {
        showAlert('loginAlert', 'Usuario o contraseña incorrectos', 'error');
        return;
      }
      renderDashboard(user);
    }

    // ----- REGISTRO (nuevo usuario público con SALT) -----
    async function doRegister() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value;

      if (!name || !email || !username || !password) {
        showAlert('registerAlert', 'Todos los campos son obligatorios', 'error');
        return;
      }
      if (password.length < 6) {
        showAlert('registerAlert', 'La contraseña debe tener mínimo 6 caracteres', 'error');
        return;
      }
      if (DB.users.find(u => u.username === username)) {
        showAlert('registerAlert', 'Nombre de usuario ya existe', 'error');
        return;
      }
      if (DB.users.find(u => u.email === email)) {
        showAlert('registerAlert', 'Email ya registrado', 'error');
        return;
      }

      const salt = generateSalt();
      const hash = await sha256WithSalt(password, salt);
      const newUser = {
        id: DB.users.length + 1,
        username,
        salt,
        password: hash,
        role: "publico",
        name,
        email,
        createdAt: new Date().toISOString()
      };
      DB.users.push(newUser);
      showAlert('registerAlert', `Cuenta creada exitosamente con rol Público`, 'success');
      // limpiar campos
      document.getElementById('regName').value = '';
      document.getElementById('regEmail').value = '';
      document.getElementById('regUser').value = '';
      document.getElementById('regPass').value = '';
      setTimeout(() => switchTab('login'), 1500);
    }

    // ----- PERMISOS POR ROL -----
    const PERMS = {
      admin: [
        { icon:'🔍', label:'Ver todo', granted:true },
        { icon:'✏️', label:'Editar contenido', granted:true },
        { icon:'👥', label:'Gestionar usuarios', granted:true },
        { icon:'⚙️', label:'Configuración sistema', granted:true },
      ],
      trabajador: [
        { icon:'🔍', label:'Ver contenido', granted:true },
        { icon:'✏️', label:'Editar contenido', granted:true },
        { icon:'👥', label:'Gestionar usuarios', granted:false },
        { icon:'⚙️', label:'Configuración', granted:false },
      ],
      publico: [
        { icon:'🔍', label:'Ver contenido público', granted:true },
        { icon:'✏️', label:'Editar contenido', granted:false },
        { icon:'👥', label:'Lista usuarios', granted:false },
        { icon:'⚙️', label:'Configuración', granted:false },
      ]
    };

    function renderDashboard(user) {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('dashCard').classList.add('active');

      const titles = { admin: '🎛️ Panel Administrador', trabajador: '🛠️ Panel Trabajador', publico: '👁️ Panel Público' };
      document.getElementById('dashTitle').innerHTML = titles[user.role];

      const badge = document.getElementById('dashBadge');
      badge.textContent = user.role.toUpperCase();
      badge.className = `role-badge badge-${user.role}`;

      document.getElementById('dName').textContent = user.name;
      document.getElementById('dUser').textContent = '@' + user.username;
      document.getElementById('dEmail').textContent = user.email;
      document.getElementById('dRole').textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1);
      document.getElementById('dTime').textContent = new Date().toLocaleString('es-MX');

      // Permisos
      const perms = PERMS[user.role];
      const grid = document.getElementById('permsGrid');
      grid.innerHTML = perms.map(p => `
        <div class="perm-card ${p.granted ? 'granted' : 'denied'}">
          <span class="perm-icon">${p.granted ? p.icon : '🚫'}</span>
          <span>${p.label}</span>
        </div>
      `).join('');

      // Panel admin: listado de usuarios
      if (user.role === 'admin') {
        document.getElementById('adminPanel').style.display = 'block';
        const usersContainer = document.getElementById('usersList');
        usersContainer.innerHTML = DB.users.map(u => `
          <div class="user-item">
            <div class="user-item-left">
              <div class="user-avatar av-${u.role}">${u.name.charAt(0).toUpperCase()}</div>
              <div class="user-meta">
                <strong>${u.name}</strong>
                <small>@${u.username} · ${u.email}</small>
              </div>
            </div>
            <span class="role-badge badge-${u.role}">${u.role}</span>
          </div>
        `).join('');
      } else {
        document.getElementById('adminPanel').style.display = 'none';
      }
    }

    function doLogout() {
      document.getElementById('dashCard').classList.remove('active');
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('loginUser').value = '';

      hideAlert('loginAlert');
